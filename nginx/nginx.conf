events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker's internal DNS resolver.
    # Forces nginx to re-resolve upstream hostnames dynamically on each request.
    # Critical: when backend/frontend containers are recreated (new deploy),
    # they get new internal IPs. Without this resolver + variable proxy_pass,
    # nginx caches the old IP at startup and gets ECONNREFUSED → 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --------------------------------------------------------
    # HTTP → HTTPS redirect (handles ALL domains)
    # --------------------------------------------------------
    server {
        listen 80;
        server_name hayon.site www.hayon.site api.hayon.site;

        # Certbot ACME challenge — needed for SSL cert issuance/renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------
    # www.hayon.site → redirect to non-www
    # --------------------------------------------------------
    server {
        listen 443 ssl;
        server_name www.hayon.site;

        ssl_certificate     /etc/letsencrypt/live/hayon.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hayon.site/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        return 301 https://hayon.site$request_uri;
    }

    # --------------------------------------------------------
    # hayon.site — Frontend
    # --------------------------------------------------------
    server {
        listen 443 ssl;
        server_name hayon.site;

        ssl_certificate     /etc/letsencrypt/live/hayon.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hayon.site/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        client_max_body_size 50m;

        location / {
            # Variable-based proxy_pass forces nginx to use the resolver
            # for DNS lookup on every request, not just at startup.
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # --------------------------------------------------------
    # api.hayon.site — Backend API + WebSocket
    # --------------------------------------------------------
    server {
        listen 443 ssl;
        server_name api.hayon.site;

        ssl_certificate     /etc/letsencrypt/live/api.hayon.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.hayon.site/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL_api:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        client_max_body_size 50m;

        # All API routes
        location /api/ {
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        # WebSocket (Socket.io)
        location /socket.io/ {
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # Health check
        location /health {
            set $backend_upstream http://backend:5000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }
    }
}
